# Builds the Astro site and publishes it to GitHub Pages.
#
# This is the ONLY host-specific file in the repo — astro.config.mjs has no
# `base` and no `.nojekyll` tricks, so moving to another host later is a change
# to this file and the adapter, not a rewrite.
#
# REQUIRES a one-time settings change before it can deploy:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# The repo is currently on the legacy "Deploy from a branch" source.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
